<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Página Web</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Alice&display=swap" rel="stylesheet">
</head>
<body>
  <img src="https://drive.google.com/thumbnail?authuser=0&sz=w640&id=1GqO6xInZB9ciisfogpwS2AiCJqbc67dI" alt="Logo" class="logo">

  <div class="contenido-fijo">
    <div id="mensaje" style="color: #000000; margin-bottom: 20px;"></div>
    <p class="texto-negro"><i class="fab fa-whatsapp whatsapp-icon"></i> Elige tus productos y haz tus pedidos.</p>
    <h2><i class="fas fa-shopping-cart"></i> Carrito (<span id="contadorCarrito">0</span>)</h2>
    <button class="btn-ver-carrito" onclick="verCarrito()">Ver carrito</button>
    
    <!-- Búsqueda y Filtros dentro del header -->
    <div class="busqueda-box">
      <i class="fas fa-search"></i>
      <input type="text" id="busquedaInput" placeholder="Buscar productos..." onkeyup="filtrarProductos()">
      <button class="btn-limpiar-busqueda" onclick="limpiarBusqueda()" title="Limpiar búsqueda">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="ordenamiento-container">
      <label for="ordenSelect"><i class="fas fa-sort"></i> Ordenar por:</label>
      <select id="ordenSelect" onchange="ordenarProductos()">
        <option value="recientes">Más recientes</option>
        <option value="nombre-asc">Nombre (A-Z)</option>
        <option value="nombre-desc">Nombre (Z-A)</option>
        <option value="precio-asc">Precio: Menor a Mayor</option>
        <option value="precio-desc">Precio: Mayor a Menor</option>
      </select>
    </div>

    <div class="resultados-info">
      <span id="contadorResultados">Mostrando 0 productos</span>
    </div>

    <div class="categorias-container">
      <button class="btn-categoria active" onclick="filtrarPorCategoria('Todas')">
        <i class="fas fa-th"></i> Todas
      </button>
      <div id="categoriasdinamicas"></div>
    </div>
  </div>

  <button class="btn-admin" onclick="toggleAdmin()" title="Panel de Administración">
    <i class="fas fa-cog"></i>
  </button>

  <div class="productos-contenedor" id="productosContenedor">
  </div>

  <!-- Modal del Carrito -->
  <div id="carritoModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="cerrarModalCarrito()">&times;</span>
      <h3>Contenido del carrito:</h3>
      <div id="contenidoCarritoModal"></div>
      <p id="totalCompra"></p>
      <button class="btn-comprar" onclick="solicitarDatosCarrito()">Comprar</button>
    </div>
  </div>

  <!-- Modal de Datos -->
  <div id="datosModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="cerrarModalDatos()">&times;</span>
      <h3>Ingrese sus datos para continuar</h3>
      <input type="text" id="nombre" placeholder="Nombre" required oninput="capitalizarInput(this)">
      <input type="text" id="apellido" placeholder="Apellido" required oninput="capitalizarInput(this)">
      <button onclick="enviarDatos()">Enviar</button>
    </div>
  </div>

  <!-- Modal de Contraseña -->
  <div id="passwordModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="cerrarPassword()">&times;</span>
      <h3>Ingrese la contraseña de administrador</h3>
      <input type="password" id="passwordInput" placeholder="Contraseña">
      <button onclick="verificarPassword()">Acceder</button>
    </div>
  </div>

  <!-- Modal de Administración -->
  <div id="adminModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="cerrarAdmin()">&times;</span>
      <h3>Panel de Administración</h3>
      
      <div class="form-group">
        <label>Nombre del Producto:</label>
        <input type="text" id="adminNombre" placeholder="Ej: Zapatos deportivos">
      </div>
      
      <div class="form-group">
        <label>Precio (Lps):</label>
        <input type="number" id="adminPrecio" placeholder="Ej: 120.00" step="0.01">
      </div>

      <!-- NUEVO: Campo de categoría -->
      <div class="form-group">
        <label>Categoría:</label>
        <input type="text" id="adminCategoria" placeholder="Ej: Zapatos, Ropa, Accesorios" list="categoriasExistentes">
        <datalist id="categoriasExistentes"></datalist>
      </div>
      
      <div class="form-group">
        <label>Imagen del Producto:</label>
        <button type="button" onclick="abrirSelectorImagenes()" class="btn-seleccionar-imagen">
          <i class="fas fa-images"></i> Seleccionar de Google Drive
        </button>
        <input type="hidden" id="adminImagen">
        <div id="previewContainer" style="display: none; margin-top: 10px;">
          <img id="imagenPreview" style="max-width: 200px; border-radius: 10px; border: 2px solid #4CAF50;">
        </div>
      </div>
      
      <button onclick="agregarProducto()" class="btn-agregar-admin">
        <i class="fas fa-plus"></i> <span id="textoBotonAdmin">Agregar Producto</span>
      </button>
      
      <input type="hidden" id="editarProductoId">
    </div>
  </div>

  <!-- Modal Selector de Imágenes -->
  <div id="modalImagenes" class="modal-imagenes">
    <div class="modal-imagenes-content">
      <div class="modal-imagenes-header">
        <h3><i class="fas fa-images"></i> Selecciona una imagen de Google Drive</h3>
        <span class="close" onclick="cerrarModalImagenes()">&times;</span>
      </div>
      <div id="imagenesContainer" class="imagenes-container">
        <!-- Las imágenes se cargarán aquí -->
      </div>
      <div class="modal-imagenes-footer">
        <button onclick="cerrarModalImagenes()" class="btn-cancelar">
          <i class="fas fa-times"></i> Cancelar
        </button>
        <button onclick="confirmarSeleccion()" class="btn-confirmar">
          <i class="fas fa-check"></i> Usar esta imagen
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    // Cargar productos al iniciar
    window.addEventListener('DOMContentLoaded', () => {
      cargarProductos();
    });
  </script>
</body>
</html>
